<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1st Anniversary, Babaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #050A16;
    --maroon-deep: #0B2340;
    --maroon-mid: #123A66;
    --maroon-accent: #2E6FA8;
    --gold: #6FB6E8;
    --gold-bright: #C3E6FF;
    --cream: #EAF4FF;
    --dim: rgba(234,244,255,0.42);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, var(--maroon-deep) 0%, transparent 60%),
      radial-gradient(ellipse 70% 40% at 50% 100%, var(--maroon-mid) 0%, transparent 65%),
      var(--black);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    position: relative;
  }

  /* ambient embers */
  #embers{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .ember{
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    box-shadow: 0 0 6px 1px rgba(111,182,232,0.8);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.7; }
    92%  { opacity: 0.35; }
    100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember{ animation: none; display:none; }
    html{ scroll-behavior: auto; }
  }

  main{
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .center-col{
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---- hero ---- */
  .hero{
    text-align: center;
    margin-bottom: 3rem;
    animation: reveal 1.6s ease-out both;
  }
  @keyframes reveal{
    from{ opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to{ opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @media (prefers-reduced-motion: reduce){ .hero{ animation: none; } }

  .hero-line{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    color: var(--gold);
    letter-spacing: 0.03em;
    margin: 0;
    text-shadow: 0 0 24px rgba(111,182,232,0.2);
  }

  .hero-name{
    font-family: 'Alex Brush', cursive;
    font-size: clamp(4.5rem, 17vw, 9rem);
    line-height: 1.05;
    margin: 0.3rem 0 0;
    display: inline-flex;
    align-items: center;
    gap: 0.15em;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 60%, var(--maroon-accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 44px rgba(111,182,232,0.32);
  }

  .heart-icon{
    width: 0.72em;
    height: 0.72em;
    flex-shrink: 0;
    filter: drop-shadow(0 0 14px rgba(111,182,232,0.55));
  }

  /* ---- film frame, big ---- */
  .video-wrap{
    width: 100%;
    margin: 0 auto 1.4rem;
  }
  .film-frame{
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    border: 1px solid rgba(111,182,232,0.55);
    box-shadow:
      0 0 0 6px rgba(10,6,5,0.6),
      0 0 80px rgba(46,111,168,0.5),
      0 0 160px rgba(46,111,168,0.22);
    overflow: hidden;
    background: #000;
  }
  .film-frame video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .film-frame::after{
    content:"";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  .now-playing{
    text-align: center;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--dim);
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.8s ease;
    margin: 1.2rem 0 0;
  }
  .now-playing.visible{ opacity: 1; }

  /* ---- synced lyrics, right under the video ---- */
  .lyrics-panel{
    height: 220px;
    overflow: hidden;
    position: relative;
    margin: 1rem auto 0;
    max-width: 640px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
  }
  .lyrics-track{
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transition: transform 0.7s ease;
  }
  .lyric-line{
    text-align: center;
    font-size: 1.9rem;
    font-style: italic;
    line-height: 2.3;
    color: rgba(242,230,222,0.28);
    transition: color 0.6s ease, transform 0.6s ease, text-shadow 0.6s ease;
    padding: 0 1rem;
  }
  .lyric-line.active{
    color: var(--gold-bright);
    font-weight: 500;
    transform: scale(1.08);
    text-shadow: 0 0 22px rgba(111,182,232,0.45);
  }
  .lyric-line.passed{ color: rgba(242,230,222,0.16); }

  /* ---- closing ---- */
  .closing{
    text-align: center;
    margin-top: 3rem;
    padding-top: 2.6rem;
    border-top: 1px solid rgba(111,182,232,0.2);
  }
  .closing-note{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.7rem, 4.2vw, 2.3rem);
    color: var(--gold-bright);
    margin: 0 0 1rem;
    text-shadow: 0 0 26px rgba(111,182,232,0.25);
  }
  .closing-sub{
    font-size: 1.25rem;
    color: var(--dim);
    max-width: 38ch;
    margin: 0 auto;
    line-height: 1.8;
  }

  audio{ display:none; }

  /* ---- verification gate ---- */
  #page-content{
    transition: filter 1s ease;
  }
  #page-content.locked{
    filter: blur(26px) brightness(0.6);
    pointer-events: none;
    user-select: none;
  }

  #gate{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(10,6,5,0.55);
    transition: opacity 0.9s ease;
  }
  #gate.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .gate-card{
    text-align: center;
    max-width: 360px;
    width: 100%;
  }
  .gate-title{
    font-family: 'Alex Brush', cursive;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    color: var(--gold-bright);
    margin: 0 0 0.3rem;
    text-shadow: 0 0 30px rgba(111,182,232,0.3);
  }
  .gate-sub{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--dim);
    font-size: 1rem;
    margin: 0 0 1.8rem;
    line-height: 1.6;
  }
  .gate-input{
    width: 100%;
    background: rgba(36,5,9,0.5);
    border: 1px solid rgba(111,182,232,0.45);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    text-align: center;
    letter-spacing: 0.08em;
    padding: 0.8rem 1rem;
    outline: none;
  }
  .gate-input::placeholder{ color: rgba(242,230,222,0.3); }
  .gate-input:focus{ border-color: var(--gold-bright); box-shadow: 0 0 20px rgba(111,182,232,0.25); }

  .gate-btn{
    margin-top: 1rem;
    width: 100%;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    color: var(--gold-bright);
    background: transparent;
    border: 1px solid rgba(111,182,232,0.55);
    padding: 0.7rem 2rem;
    cursor: pointer;
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .gate-btn:hover, .gate-btn:focus-visible{
    background: rgba(111,182,232,0.1);
    box-shadow: 0 0 26px rgba(111,182,232,0.25);
    outline: none;
  }

  .gate-error{
    margin-top: 0.9rem;
    font-size: 0.9rem;
    font-style: italic;
    color: #E8B86D;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .gate-error.visible{ opacity: 1; }

  .gate-card.shake{ animation: shake 0.4s; }
  @keyframes shake{
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  @media (prefers-reduced-motion: reduce){
    .gate-card.shake{ animation: none; }
    #page-content{ transition: none; }
    #gate{ transition: none; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card" id="gateCard">
    <p class="gate-title">A little verification &#10084;</p>
    <p class="gate-sub">our surname initials + our anniversary date</p>
    <input type="password" id="gateInput" class="gate-input" placeholder="enter passcode" autocomplete="off">
    <button id="gateBtn" class="gate-btn">Unlock</button>
    <p class="gate-error" id="gateError">that's not quite it, try again</p>
  </div>
</div>

<div id="page-content" class="locked">

<div id="embers"></div>

<main>

  <div class="center-col">
    <header class="hero">
      <p class="hero-line">Happy 1<sup>st</sup> Anniversary</p>
      <h1 class="hero-name">Babaa <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#C3E6FF"/>
            <stop offset="60%" stop-color="#6FB6E8"/>
            <stop offset="130%" stop-color="#2E6FA8"/>
          </linearGradient>
        </defs>
        <path fill="url(#heartGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg></h1>
    </header>
  </div>

  <div class="video-wrap">
    <section class="film-frame">
      <video id="bgVideo" src="video.mp4" playsinline loop muted></video>
    </section>
    <p class="now-playing" id="nowPlaying">&#9834; now playing — You Are The One</p>
    <div class="lyrics-panel">
      <div class="lyrics-track" id="lyricsTrack"></div>
    </div>
  </div>

  <div class="center-col">
    <footer class="closing">
      <p class="closing-note">Happy Anniversary to my LOML,</p>
      <p class="closing-sub">Our first chapter of forever.<br>I love youuuuuu so so muchhhhh BABAA.</p>
    </footer>
  </div>

</main>

<audio id="bgMusic" src="song.mp3" preload="auto" loop></audio>

</div>

<script>
  // ---- ambient embers ----
  const emberContainer = document.getElementById('embers');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) {
    const count = 22;
    for (let i = 0; i < count; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = Math.random() * 100 + 'vw';
      e.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      e.style.animationDuration = (10 + Math.random() * 10) + 's';
      e.style.animationDelay = (Math.random() * 12) + 's';
      emberContainer.appendChild(e);
    }
  }

  // ---- lyrics data (only this section of the song) ----
  // Timestamps (seconds) are estimated from the song's pacing —
  // edit the numbers below if you want a line to land more precisely.
  const lyrics = [
    [2,  "And when I finally do (and when I finally do)"],
    [5,  "I know inside my heart (I know inside my heart)"],
    [9,  "That there could be no doubt, I knew it from the start"],
    [15, "(you are the one) you are the one"],
    [18, "That I've been searching for my whole life through,"],
    [23, "(you are the one) you are the one that I've been looking for"],
    [28, "And now that I have found you,"],
    [31, "I'll never let you go, I'll hold you in my arms"],
    [40, "You are the one"],
    [58, "Another night spent alone"],
    [64, "I'm lying in the dark (lying in the dark)"],
    [70, "I don't know your name"],
    [75, "But I know your voice sings to my heart (voice sings to my heart)"],
    [81, "A sweet melody, a symphony of love"]
  ];

  // These lines are the chorus ("you are the one...") — volume rises here.
  const chorusIndices = new Set([3,4,5,6,7,8]);
  const BASE_VOLUME = 0.55;
  const CHORUS_VOLUME = 0.95;

  const track = document.getElementById('lyricsTrack');
  const lineEls = lyrics.map((item, i) => {
    const p = document.createElement('p');
    p.className = 'lyric-line';
    p.textContent = item[1];
    track.appendChild(p);
    return p;
  });

  let activeIndex = -1;

  function findIndex(t) {
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) {
      if (t >= lyrics[i][0]) idx = i;
    }
    return idx;
  }

  let fadeHandle = null;
  function fadeVolumeTo(target, ms = 1200) {
    if (fadeHandle) cancelAnimationFrame(fadeHandle);
    const start = audio.volume;
    const startTime = performance.now();
    function step(now) {
      const p = Math.min(1, (now - startTime) / ms);
      audio.volume = start + (target - start) * p;
      if (p < 1) fadeHandle = requestAnimationFrame(step);
    }
    fadeHandle = requestAnimationFrame(step);
  }

  function updateLyrics(idx) {
    if (idx === activeIndex) return;
    activeIndex = idx;
    lineEls.forEach((el, i) => {
      el.classList.remove('active', 'passed');
      if (i === idx) el.classList.add('active');
      else if (i < idx) el.classList.add('passed');
    });
    if (idx >= 0) {
      const lineHeight = lineEls[idx].offsetHeight;
      track.style.transform = `translateY(calc(-${idx * lineHeight}px - ${lineHeight / 2}px))`;
    }
    fadeVolumeTo(idx >= 0 && chorusIndices.has(idx) ? CHORUS_VOLUME : BASE_VOLUME);
  }

  const audio = document.getElementById('bgMusic');
  const video = document.getElementById('bgVideo');
  const nowPlaying = document.getElementById('nowPlaying');
  let started = false;

  audio.addEventListener('timeupdate', () => {
    updateLyrics(findIndex(audio.currentTime));
  });

  function beginPlayback() {
    if (started) return;
    // Video stays muted permanently — only the background song plays.
    video.muted = true;
    audio.volume = BASE_VOLUME;
    Promise.all([video.play(), audio.play()]).then(() => {
      started = true;
      nowPlaying.classList.add('visible');
    }).catch(() => {
      // Browser blocked autoplay until a real user gesture —
      // the first tap/click anywhere on the page will start it.
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('gateInput').focus();
  });

  // Not shown to the person — checked against what they type.
  const PASSCODE = 'PL091225';

  const gate = document.getElementById('gate');
  const gateCard = document.getElementById('gateCard');
  const gateInput = document.getElementById('gateInput');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  const pageContent = document.getElementById('page-content');

  function tryUnlock() {
    const value = gateInput.value.trim();
    if (value === PASSCODE) {
      gate.classList.add('hidden');
      pageContent.classList.remove('locked');
      beginPlayback();
    } else {
      gateError.classList.add('visible');
      gateCard.classList.remove('shake');
      void gateCard.offsetWidth;
      gateCard.classList.add('shake');
    }
  }

  gateBtn.addEventListener('click', tryUnlock);
  gateInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });

  audio.addEventListener('ended', () => {
    nowPlaying.classList.remove('visible');
    started = false;
  });
</script>

</body>
</html>
