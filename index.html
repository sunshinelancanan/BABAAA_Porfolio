<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1st Anniversary, Babaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0A0605;
    --maroon-deep: #240509;
    --maroon-mid: #4A0F1C;
    --maroon-accent: #7A1B2E;
    --gold: #C9A66B;
    --gold-bright: #E8CC8F;
    --cream: #F2E6DE;
    --dim: rgba(242,230,222,0.38);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, var(--maroon-deep) 0%, transparent 60%),
      radial-gradient(ellipse 70% 40% at 50% 100%, var(--maroon-mid) 0%, transparent 65%),
      var(--black);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    position: relative;
  }

  /* ---- giant lyric backdrop, sits behind everything ---- */
  .lyric-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vw;
    pointer-events: none;
  }
  .lyric-bg span{
    display: block;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1.8rem, 6vw, 4.2rem);
    line-height: 1.3;
    color: rgba(201,166,107,0.10);
    max-width: 20ch;
    transition: opacity 1.4s ease, transform 1.4s ease;
    opacity: 0;
    transform: scale(0.97);
  }
  .lyric-bg span.showing{
    opacity: 1;
    transform: scale(1);
  }

  /* ambient embers */
  #embers{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .ember{
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    box-shadow: 0 0 6px 1px rgba(201,166,107,0.8);
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.7; }
    92%  { opacity: 0.35; }
    100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ember{ animation: none; display:none; }
    html{ scroll-behavior: auto; }
    .lyric-bg span{ transition: none; }
  }

  main{
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4rem;
  }

  .center-col{
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---- hero ---- */
  .hero{
    text-align: center;
    margin-bottom: 3rem;
    animation: reveal 1.6s ease-out both;
  }
  @keyframes reveal{
    from{ opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to{ opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @media (prefers-reduced-motion: reduce){ .hero{ animation: none; } }

  .hero-line{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.4rem, 4.2vw, 1.9rem);
    color: var(--dim);
    letter-spacing: 0.02em;
    margin: 0;
  }

  .hero-name{
    font-family: 'Alex Brush', cursive;
    font-size: clamp(4rem, 15vw, 7.5rem);
    line-height: 1.05;
    margin: 0.2rem 0 0.6rem;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 60%, var(--maroon-accent) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 34px rgba(201,166,107,0.25);
  }

  .hero-sub{
    font-size: clamp(1rem, 2.6vw, 1.15rem);
    color: var(--dim);
    font-style: italic;
    max-width: 34ch;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ---- film frame, big ---- */
  .video-wrap{
    width: 100%;
    margin: 0 auto 1.4rem;
  }
  .film-frame{
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    border: 1px solid rgba(201,166,107,0.55);
    box-shadow:
      0 0 0 6px rgba(10,6,5,0.6),
      0 0 80px rgba(122,27,46,0.5),
      0 0 160px rgba(122,27,46,0.22);
    overflow: hidden;
    background: #000;
  }
  .film-frame video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .film-frame::after{
    content:"";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 90px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  .now-playing{
    text-align: center;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--dim);
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.8s ease;
    margin: 1rem 0 3.2rem;
  }
  .now-playing.visible{ opacity: 1; }

  /* ---- closing ---- */
  .closing{
    text-align: center;
    margin-top: 3rem;
    padding-top: 2.6rem;
    border-top: 1px solid rgba(201,166,107,0.2);
  }
  .closing-note{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.4rem, 3.6vw, 1.8rem);
    color: var(--gold-bright);
    margin: 0 0 0.9rem;
  }
  .closing-sub{
    font-size: 1.1rem;
    color: var(--dim);
    max-width: 38ch;
    margin: 0 auto;
    line-height: 1.7;
  }

  audio{ display:none; }
</style>
</head>
<body>

<div class="lyric-bg" id="lyricBg"></div>
<div id="embers"></div>

<main>

  <div class="center-col">
    <header class="hero">
      <p class="hero-line">Happy 1<sup>st</sup> Anniversary</p>
      <h1 class="hero-name">Babaa &#10084;</h1>
      <p class="hero-sub">one year, countless firsts, and a lifetime of memories still ahead for us.</p>
    </header>
  </div>

  <div class="video-wrap">
    <section class="film-frame">
      <video id="bgVideo" src="video.mp4" playsinline loop muted></video>
    </section>
  </div>

  <p class="now-playing" id="nowPlaying">&#9834; now playing — You Are The One</p>

  <div class="center-col">
    <footer class="closing">
      <p class="closing-note">Happy Anniversary to my LOML,</p>
      <p class="closing-sub">One year, countless firsts, and a lifetime of memories still ahead for us.</p>
    </footer>
  </div>

</main>

<audio id="bgMusic" src="song.mp3" preload="auto"></audio>

<script>
  // ---- ambient embers ----
  const emberContainer = document.getElementById('embers');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) {
    const count = 22;
    for (let i = 0; i < count; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = Math.random() * 100 + 'vw';
      e.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      e.style.animationDuration = (10 + Math.random() * 10) + 's';
      e.style.animationDelay = (Math.random() * 12) + 's';
      emberContainer.appendChild(e);
    }
  }

  // ---- lyrics data ----
  // Timestamps (seconds) are estimated from the song's typical pacing —
  // edit the numbers below if you want a line to land more precisely.
  const lyrics = [
    [13,  "Another day passes by, I'm dreamin' of you,"],
    [20,  "And though I know it might be just a dream, dreams come true,"],
    [26,  "Somewhere, somehow I'll find you even though it takes all of"],
    [32,  "My life (all of my life)"],
    [38,  "And when I finally do (and when I finally do)"],
    [43,  "I know inside my heart (I know inside my heart)"],
    [48,  "That there could be no doubt, I knew it from the start"],
    [54,  "(you are the one) you are the one"],
    [59,  "That I've been searching for my whole life through,"],
    [65,  "(you are the one) you are the one that I've been looking for"],
    [71,  "And now that I have found you,"],
    [76,  "I'll never let you go, I'll hold you in my arms"],
    [82,  "You are the one"],
    [94,  "Another night spent alone"],
    [100, "I'm lying in the dark (lying in the dark)"],
    [106, "I don't know your name"],
    [111, "But I know your voice sings to my heart (voice sings to my heart)"],
    [117, "A sweet melody, a symphony of love"],
    [123, "I know that come one day (I know that come one day)"],
    [128, "I time for you and me (a time for you and me)"],
    [133, "To finally be together, cause I know we're meant to be"],
    [139, "(you are the one) you are the one"],
    [144, "That I've been searching for my whole life through,"],
    [150, "(you are the one) you are the one that I've been looking for"],
    [156, "And now that I have found you,"],
    [161, "I'll never let you go, I'll hold you in my arms"],
    [190, "Forever's a meaningless word"],
    [196, "Even though you're here with me"],
    [201, "Here by my side, here in my heart"],
    [207, "I'll never let you go I'll hold you in my arms"],
    [215, "(you are the one) you are the one that I've been searching for my whole life through"],
    [224, "(you are the one) you are the one that I've been looking for and now that I have found you"],
    [233, "I'll never let you go, I'll hold you in my arms"],
    [242, "Cause you are the one, you are the one"]
  ];

  // Indices in the `lyrics` array above that are chorus lines
  // ("you are the one..."). Volume rises for these, then settles
  // back down for verses/bridge.
  const chorusIndices = new Set([7,8,9,10,11,12, 21,22,23,24,25, 30,31,32,33]);

  const BASE_VOLUME = 0.55;
  const CHORUS_VOLUME = 0.95;

  const lyricBg = document.getElementById('lyricBg');
  let currentSpan = null;
  let activeIndex = -1;

  function findIndex(t) {
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) {
      if (t >= lyrics[i][0]) idx = i;
    }
    return idx;
  }

  // Smoothly ramps audio.volume toward a target over ~1.2s.
  let fadeHandle = null;
  function fadeVolumeTo(target, ms = 1200) {
    if (fadeHandle) cancelAnimationFrame(fadeHandle);
    const start = audio.volume;
    const startTime = performance.now();
    function step(now) {
      const p = Math.min(1, (now - startTime) / ms);
      audio.volume = start + (target - start) * p;
      if (p < 1) {
        fadeHandle = requestAnimationFrame(step);
      }
    }
    fadeHandle = requestAnimationFrame(step);
  }

  function showLine(idx) {
    if (idx === activeIndex) return;
    activeIndex = idx;
    if (currentSpan) {
      currentSpan.classList.remove('showing');
    }
    fadeVolumeTo(idx >= 0 && chorusIndices.has(idx) ? CHORUS_VOLUME : BASE_VOLUME);
    if (idx < 0) return;
    const span = document.createElement('span');
    span.textContent = lyrics[idx][1];
    lyricBg.innerHTML = '';
    lyricBg.appendChild(span);
    // force reflow so the transition triggers
    void span.offsetWidth;
    span.classList.add('showing');
    currentSpan = span;
  }

  const audio = document.getElementById('bgMusic');
  const video = document.getElementById('bgVideo');
  const nowPlaying = document.getElementById('nowPlaying');
  let started = false;

  audio.addEventListener('timeupdate', () => {
    showLine(findIndex(audio.currentTime));
  });

  function beginPlayback() {
    if (started) return;
    // Video stays muted permanently — only the background song plays.
    video.muted = true;
    audio.volume = BASE_VOLUME;
    Promise.all([video.play(), audio.play()]).then(() => {
      started = true;
      nowPlaying.classList.add('visible');
    }).catch(() => {
      // Browser blocked autoplay until a real user gesture —
      // the first tap/click anywhere on the page will start it.
    });
  }

  window.addEventListener('DOMContentLoaded', beginPlayback);
  document.addEventListener('click', beginPlayback, { once: true });

  audio.addEventListener('ended', () => {
    nowPlaying.classList.remove('visible');
    started = false;
  });
</script>

</body>
</html>
